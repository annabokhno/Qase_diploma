# This workflow will build a Java project with Maven and run UI and API tests

name: Qase Diploma CI

on:
  push:
    branches: [ master, main, "feature/*" ]
  pull_request:
    branches: [ master, main, "feature/*" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:
    runs-on: ubuntu-latest

    env:
      QASE_EMAIL: ${{ secrets.QASE_EMAIL }}
      QASE_PASSWORD: ${{ secrets.QASE_PASSWORD }}
      QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
      HEADLESS: true

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run tests
        run: >
          mvn clean test
          -DQASE_EMAIL="${QASE_EMAIL}"
          -DQASE_PASSWORD="${QASE_PASSWORD}"
          -DQASE_API_TOKEN="${QASE_API_TOKEN}"

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Restore Allure history
        if: always()
        run: |
          if [ -d gh-pages/last-history ]; then
            mkdir -p target/allure-results/history
            cp -r gh-pages/last-history/. target/allure-results/history/
          fi

      - name: Generate Allure Report
        if: always()
        run: allure generate target/allure-results --clean -o allure-report

      - name: Prepare allure-history for Pages
        if: always()
        run: |
          NEXT_RUN=$(($(ls -d gh-pages/[0-9]* 2>/dev/null | wc -l) + 1))
          mkdir -p allure-history/$NEXT_RUN
          cp -r allure-report/. allure-history/$NEXT_RUN/
          mkdir -p allure-history/last-history
          cp -r allure-report/history/. allure-history/last-history/ 2>/dev/null || true
          ls -d gh-pages/[0-9]* 2>/dev/null | sort -V | tail -20 | while read dir; do
            cp -r "$dir" allure-history/
          done
          touch allure-history/.nojekyll
          echo "<meta http-equiv='refresh' content='0; url=$NEXT_RUN/index.html'>" > allure-history/index.html

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-history

  deploy:
    needs: build
    if: always()
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

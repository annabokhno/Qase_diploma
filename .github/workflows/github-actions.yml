# This workflow will build a Java project with Maven and run UI tests

name: Qase Diploma CI

on:
  push:
    branches:
      - master
      - main
      - feature/*
  pull_request:
    branches:
      - master
      - main
      - feature/*
  workflow_dispatch:


permissions:
  contents: write
  pages: write
  id-token: write


jobs:

  build:

    runs-on: ubuntu-latest

    env:
      QASE_EMAIL: ${{ secrets.QASE_EMAIL }}
      QASE_PASSWORD: ${{ secrets.QASE_PASSWORD }}
      HEADLESS: true

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven


      - name: Run tests
        run: mvn clean test


      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results
          allure_history: allure-history


      - name: Check Allure files
        if: always()
        run: |
          echo "Allure history:"
          ls -la allure-history


      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-history



  deploy:

    needs: build

    if: always()

    runs-on: ubuntu-latest


    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5